[colors]
background = #601D1E2F
background-alt = #60373B41
foreground = #C5C8C6
primary = #739DF0
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 18pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "AdwaitaMono Nerd Font:style=Regular:size=11;2"
font-1 = "AdwaitaMono Nerd Font:style=Regular:size=13;2"

; tray-position = right
;tray-detached = false
;tray-maxsize = 16
;tray-background = ${colors.background}
;tray-offset-x = -3
;tray-offset-y = 0
;tray-padding = 2
;tray-scale = 1.0

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio temperature battery memory cpu wlan tray
modules-center = date
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = xfwm4
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#739DF0}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "%{T2}󰕾%{T-} "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T2}%{T-}  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#739DF0}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#739DF0}%{T2}󰤨%{T-}%{F-}  %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#739DF0}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M:%S
date-alt = %H:%M

label = %date%
label-foreground = ${colors.foreground}

[module/temperature]
type= internal/temperature
interval = 0.5
thermal-zone = 0
zone-type = acpitz
hwmon-path = 
base-temperature = 0
warn-temperature = 70
label = %{F#739DF0}%{T2}%{T-}%{F-} %temperature-c%
label-warn = %{T2}%{T-} %temperature-c%
label-warn-foreground = #f00

[module/battery]
type=internal/battery
full-at=99
low-at=5
battery=BAT1
adapter=ACAD
poll-interval=5
format-charging = <animation-charging>  <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
label-low = ! 
label-charging = Ch %percentage%%
label-discharging = Ds %percentage%%
ramp-capacity-0=%{F#739DF0}%{T2}%{T-}%{F-}
ramp-capacity-1=%{F#739DF0}%{T2}%{T-}%{F-}
ramp-capacity-2=%{F#739DF0}%{T2}%{T-}%{F-}
ramp-capacity-3=%{F#739DF0}%{T2}%{T-}%{F-}
ramp-capacity-4=%{F#739DF0}%{T2}%{T-}%{F-}

animation-charging-0=%{F#739DF0}%{T2}%{T-}%{F-}
animation-charging-1=%{F#739DF0}%{T2}%{T-}%{F-}
animation-charging-2=%{F#739DF0}%{T2}%{T-}%{F-}
animation-charging-3=%{F#739DF0}%{T2}%{T-}%{F-}
animation-charging-4=%{F#739DF0}%{T2}%{T-}%{F-}
animation-charging-framerate = 750

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
