# Use OpenGL backend for hardware acceleration & high refresh rate support
backend = "glx";
use-damage = true;
vsync = true;

#################################
#    Gaming & Performance       #
#################################
# Bypasses compositing completely for fullscreen games to minimize input lag
unredir-if-possible = true;
unredir-if-possible-exclude = [
    "class_g = 'Looking-glass'"
];

#################################
#           Fading              #
#################################
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
#           Opacity             #
#################################
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Exclude specific apps from opacity tweaks (like video players or games)
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'mpv'",
    "class_g = 'vlc'"
];

#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       Window Types Rules      #
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
